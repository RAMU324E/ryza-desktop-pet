[project]
name = "ryza-moka-app"
version = "0.1.0"
description = "Ryza Spine desktop pet host built on MOKAMOKA"
requires-python = ">=3.11"
dependencies = [
  "aiohttp>=3.9",
  "httpx>=0.27",
  "PyYAML>=6.0",
]

[project.scripts]
ryza-moka = "ryza_moka.app:main"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["ryza_moka*"]

[tool.setuptools.package-data]
ryza_moka = ["default_prompt.md"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
